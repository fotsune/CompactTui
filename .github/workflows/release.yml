name: Build Release Windows

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: pyinstaller --onefile --noconfirm compacttui.py

      # Переменная шага живёт только в нём; тег кладём в GITHUB_ENV,
      # чтобы следующие шаги видели одно и то же имя.
      - name: Compute tag
        shell: bash
        run: echo "TAG_NAME=v$(date +%Y%m%d%H%M%S)" >> "$GITHUB_ENV"

      - name: Create release
        run: gh release create "$env:TAG_NAME" dist/CompactTui.exe --title "Release $env:TAG_NAME" --notes "Automatic release generated by GitHub Actions."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push built file
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          Copy-Item dist/CompactTui.exe CompactTui.exe -Force
          git add CompactTui.exe
          if (git diff --cached --quiet) {
            "CompactTui.exe unchanged"
          } else {
            git commit -m "Add built executable"
            git push origin HEAD:main
          }
